name: BENFRANK v5.0 repair missing 2026 NBA scoreboard dates
on:
  push:
    branches: [benfrank-v50-2026-current-asof-trueup, main]
    paths:
      - 'benfrank_v50_recover_espn_gap.py'
      - 'tests/test_v50_recover_espn_gap.py'
      - '.github/workflows/v50-recover-source-gaps.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test no future-game or unfinished box-score injection
        run: python -m unittest discover -s tests -p 'test_v50_recover_espn_gap.py' -v
  recover-original-missing-source-days:
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Retrieve immutable v5.0 earlier-game source snapshot
        uses: actions/download-artifact@v4
        with:
          run-id: '41155639494'
          name: 'benfrank-v50-2026-27-current-asof-41155639494'
          github-token: ${{ github.token }}
          path: evidence
      - name: Recover only completed and independently dated ESPN summaries from missing 26–27 October
        run: |
          python -u benfrank_v50_recover_espn_gap.py \
            --input-db evidence/current_2026_27.sqlite \
            --output-db receipts/v50-recovered-current.sqlite \
            --output-receipt receipts/v50-gap-recovery.json \
            --first-id 401909868 --last-id 401909880 \
            --target-date 2026-10-30 --dates 2026-10-26 2026-10-27
      - name: Verify no hindsight and explicit source outcome
        if: always()
        run: |
          python - <<'PY'
          import os,json,sqlite3
          p='receipts/v50-gap-recovery.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Missing October 26–27 source recovery\n\n')
              if not os.path.exists(p):
                  f.write('No game receipts produced; source remains incomplete.\n')
              else:
                  r=json.load(open(p))
                  f.write(f"Status **{r['status']}**, recovered {r['new_rows']} played player games from {len(r['recovered_games'])} final NBA games.\n")
                  f.write('Unresolved event IDs: '+str([x['event_id'] for x in r['errors']])+'\n')
                  f.write('Source: ESPN secondary final game summaries, not official independent validation.\n')
          PY
      - name: Preserve recovered data in a separate source-tier artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benfrank-v50-2026-gap-recovery-${{ github.run_id }}
          path: receipts/
          if-no-files-found: warn
          retention-days: 30
