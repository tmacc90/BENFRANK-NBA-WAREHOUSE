name: BENFRANK mobile API smoke
on:
  push:
    paths:
      - 'mobile/**'
      - 'Dockerfile.mobile'
      - 'render.yaml'
      - '.dockerignore'
      - 'tests/test_mobile_api.py'
      - 'scripts/test_mobile_browser.py'
      - 'benfrank_auto_context.py'
      - 'benfrank_auto_runner.py'
      - 'benfrank_v52_ledger.py'
      - 'scripts/verify_auto_run.py'
      - '.github/workflows/mobile-smoke.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'Dockerfile.mobile'
      - 'render.yaml'
      - '.dockerignore'
      - 'tests/test_mobile_api.py'
      - 'scripts/test_mobile_browser.py'
      - 'benfrank_auto_context.py'
      - 'benfrank_auto_runner.py'
      - 'benfrank_v52_ledger.py'
      - 'scripts/verify_auto_run.py'
      - '.github/workflows/mobile-smoke.yml'
  workflow_dispatch:
jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile new mobile code
        run: python -m compileall -q mobile
      - name: Install API and runner dependencies
        run: pip install -r requirements.txt -r mobile/requirements.txt -r mobile/requirements-test.txt
      - name: Verify ASGI import
        run: python -c "from mobile.api import app; assert app.title == 'BENFRANK mobile API'"
      - name: Run preserved regression tests
        run: python -m unittest discover -s tests -v
      - name: Install mobile test browsers
        run: python -m playwright install --with-deps webkit
      - name: Verify iPhone and iPad browser layouts and API interactions
        run: python scripts/test_mobile_browser.py --output mobile-browser-results
      - name: Build the deployment Docker image
        run: docker build -f Dockerfile.mobile -t benfrank-mobile:ci .
      - name: Verify the container and authenticated routes
        run: |
          mkdir -p "$RUNNER_TEMP/benfrank-mobile-disk"
          BENFRANK_TEST_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$BENFRANK_TEST_TOKEN"
          docker run -d --name benfrank-mobile-ci -p 8080:8080 \
            -v "$RUNNER_TEMP/benfrank-mobile-disk:/var/lib/benfrank" \
            -e BENFRANK_API_TOKEN="$BENFRANK_TEST_TOKEN" \
            -e BENFRANK_REQUIRE_PERSISTENT_STORAGE=true benfrank-mobile:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /tmp/benfrank-health.json; then break; fi
            sleep 2
          done
          python -c "import json; d=json.load(open('/tmp/benfrank-health.json')); assert d['status']=='ok' and d['storage']['persistent_mount_verified']"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/jobs/unknown)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $BENFRANK_TEST_TOKEN" http://127.0.0.1:8080/api/jobs/unknown)" = 404
          curl -fsS http://127.0.0.1:8080/ > /tmp/benfrank-home.html
          docker logs benfrank-mobile-ci
      - name: Save mobile test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benfrank-mobile-validation
          path: mobile-browser-results
          if-no-files-found: warn
