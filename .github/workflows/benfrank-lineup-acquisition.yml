name: BENFRANK lineup WOWY acquisition
on:
  push:
    branches:
      - benfrank-lineup-wowy-reconstruction-20261107
    paths:
      - "benfrank_lineup_acquisition.py"
      - "benfrank_lineup_mirror.py"
      - "benfrank_v52_early.py"
      - "benfrank_auto_runner.py"
      - "tests/test_lineup_acquisition.py"
      - "tests/test_lineup_adjustment.py"
      - "tests/test_lineup_mirror.py"
      - ".github/workflows/benfrank-lineup-acquisition.yml"
  workflow_dispatch:
    inputs:
      game_id:
        description: "10-digit completed NBA game ID"
        required: true
        default: "0022600032"
      season_end:
        description: "NBA season ending year"
        required: true
        default: "2027"
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit tests for acquisition/reconstruction
        run: |
          python -m unittest tests.test_lineup_acquisition -v
          python -m unittest tests.test_lineup_adjustment -v
          python -m unittest tests.test_lineup_mirror -v
      - name: Acquire SportsDataverse possession and lineup mirror
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GAME_ID="${{ inputs.game_id }}"
            SEASON="${{ inputs.season_end }}"
          else
            GAME_ID="0022600032"
            SEASON="2027"
          fi
          python - "$GAME_ID" "$SEASON" <<'PY'
          import json
          import sys
          from pathlib import Path
          from benfrank_lineup_mirror import load_season, _game_frames, validate_game

          game_id = sys.argv[1]
          season = int(sys.argv[2])
          cache = Path("lineup_cache")
          frames = load_season(cache, season)
          game = _game_frames(frames, game_id)
          validation = validate_game(game)
          receipt = {
              "game_id": game_id,
              "season": season,
              "upstream_commit": frames["_commit"],
              "rows": {k: len(v) for k, v in game.items()},
              "validation": validation,
          }
          out = cache / "mirror_smoke_receipt.json"
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          if validation["quality"] not in ("FULL", "FALLBACK"):
              raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benfrank-lineup-reconstruction
          path: lineup_cache/
          if-no-files-found: warn
