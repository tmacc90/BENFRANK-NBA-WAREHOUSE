name: BENFRANK lineup WOWY acquisition
on:
  push:
    branches:
      - benfrank-lineup-wowy-reconstruction-20261107
    paths:
      - "benfrank_lineup_acquisition.py"
      - "tests/test_lineup_acquisition.py"
      - ".github/workflows/benfrank-lineup-acquisition.yml"
  workflow_dispatch:
    inputs:
      game_ids:
        description: "Comma-separated 10-digit completed NBA game IDs"
        required: true
        default: "0022600032"
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Unit tests for acquisition/reconstruction
        run: python -m unittest tests.test_lineup_acquisition -v
      - name: Acquire one completed game and reconstruct
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            IDS="${{ inputs.game_ids }}"
          else
            IDS="0022600032"
          fi
          ARGS=""
          IFS=',' read -ra GAME_IDS <<< "$IDS"
          for id in "${GAME_IDS[@]}"; do
            CLEAN="${id// /}"
            ARGS="$ARGS --game-id $CLEAN"
          done
          python benfrank_lineup_acquisition.py $ARGS --output lineup_cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benfrank-lineup-reconstruction
          path: lineup_cache/
          if-no-files-found: warn
