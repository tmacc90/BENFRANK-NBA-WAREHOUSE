name: BENFRANK lineup WOWY acquisition
on:
  workflow_dispatch:
    inputs:
      game_ids:
        description: "Comma-separated 10-digit NBA game IDs"
        required: true
        default: "0022600197"
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Acquire and reconstruct
        shell: bash
        run: |
          ARGS=""
          IFS=',' read -ra IDS <<< "${{ inputs.game_ids }}"
          for id in "${IDS[@]}"; do ARGS="$ARGS --game-id ${id// /}"; done
          python benfrank_lineup_acquisition.py $ARGS --output lineup_cache
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benfrank-lineup-reconstruction
          path: lineup_cache/
          if-no-files-found: warn
