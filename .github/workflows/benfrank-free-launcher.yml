name: BENFRANK Free Run Framework (iPhone)
run-name: "BENFRANK mobile free research | ${{ inputs.game_date || 'today' }}"
on:
  push:
    paths:
      - '.github/workflows/benfrank-free-launcher.yml'
  workflow_dispatch:
    inputs:
      game_date:
        default: 'today'
        description: 'NBA slate date: today (Eastern) or YYYY-MM-DD (pregame only)'
        required: true
        type: string
      player:
        description: 'Optional exact player name (enter market and line too)'
        required: false
        type: string
      market:
        description: 'Optional exact market: points/rebounds/assists/etc.'
        required: false
        type: string
      line:
        description: 'Optional exact prop line (e.g. 22.5)'
        required: false
        type: string
      max_props:
        description: 'Maximum native-board props to analyze (1-6)'
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '4', '6']
      max_games:
        description: 'Maximum NBA games (1-3)'
        required: true
        default: '2'
        type: choice
        options: ['1', '2', '3']
permissions:
  contents: read
concurrency:
  group: benfrank-free-run
  cancel-in-progress: false
jobs:
  registration:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm free launcher registration
        run: echo 'BENFRANK free launcher registered; manually start Run workflow to execute predictions.'
  forecast:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: benfrank-60-question-interrogation-20261106
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing free-source framework dependencies
        run: python -m pip install -r requirements.txt
      - name: Create source-backed discovery request
        env:
          GAME_DATE: ${{ inputs.game_date }}
          MAX_PROPS: ${{ inputs.max_props || '1' }}
          MAX_GAMES: ${{ inputs.max_games || '1' }}
          PLAYER: ${{ inputs.player }}
          MARKET: ${{ inputs.market }}
          LINE: ${{ inputs.line }}
        run: |
          python - <<'PY'
          import datetime as dt,json,math,os,pathlib
          from zoneinfo import ZoneInfo
          raw_day=os.environ['GAME_DATE'].strip().lower()
          day=(dt.datetime.now(ZoneInfo('America/New_York')).date()
               if raw_day in ('today','') else dt.date.fromisoformat(raw_day))
          if day < dt.datetime.now(ZoneInfo('America/New_York')).date():
              raise SystemExit('PAST_NBA_SLATE_DATE_NOT_ALLOWED_IN_FORWARD_MODE')
          config={'mode':'future_discovery','game_date':day.isoformat(),
                  'max_props':int(os.environ['MAX_PROPS']),
                  'max_games':int(os.environ['MAX_GAMES'])}
          player=os.environ.get('PLAYER','').strip()
          market=os.environ.get('MARKET','').strip().lower()
          raw_line=os.environ.get('LINE','').strip()
          if any((player,market,raw_line)):
              if not all((player,market,raw_line)):
                  raise SystemExit('EXACT_PROP_REQUIRES_PLAYER_MARKET_LINE')
              try:
                  line=float(raw_line)
              except ValueError:
                  raise SystemExit('EXACT_PROP_LINE_NOT_NUMERIC')
              if not math.isfinite(line) or line<0 or line>10000:
                  raise SystemExit('INVALID_EXACT_PROP_LINE')
              if market not in ('points','rebounds','assists','threes','pra','pr','pa','ra',
                                'steals','blocks','turnovers','fantasy_score'):
                  raise SystemExit('UNSUPPORTED_MARKET')
              config['requested_prop']={'player':player,'market':market,'line':line}
          pathlib.Path('free-run-config.json').write_text(json.dumps(config,indent=2))

          PY
      - name: Execute original BENFRANK runner (no synthetic success)
        id: run
        continue-on-error: true
        run: |
          python run_framework.py --auto free-run-config.json --output free-run-output --state-dir free-run-state --trials 25000 --stress-trials 2000
      - name: Print exact blockers and evidence summary
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('free-run-output/execution_receipt.json')
          if not p.exists():
              print('NO_EXECUTION_RECEIPT: runner failed before creating receipt')
          else:
              r=json.loads(p.read_text())
              print('STATUS:',r.get('status'))
              print('FATAL:',r.get('fatal_blocker'))
              print('FROZEN:',r.get('predictions_frozen_before_tipoff'))
              for x in r.get('props',[]):
                  print(x.get('prop',{}).get('player'),x.get('direction'),x.get('status'),x.get('exact_blocker'))
          PY
      - name: Produce offline iPhone and iPad report from receipts
        if: always()
        run: |
          if [ -f free-run-output/execution_receipt.json ]; then
            python scripts/build_free_mobile_report.py --input free-run-output/execution_receipt.json --output free-run-output/mobile_report.html
          else
            echo "No receipt available to render; the workflow remains failed."
          fi
      - name: Upload report, receipts, sources, and model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benfrank-free-run-${{ github.run_id }}
          path: |
            free-run-config.json
            free-run-output/readiness_report.md
            free-run-output/execution_receipt.json
            free-run-output/board.json
            free-run-output/discovery.json

            free-run-output/source_manifest.json
            free-run-output/props/*/stage_receipt.json
            free-run-output/props/*/historical_windows.json
            free-run-output/props/*/interrogation_60.json
            free-run-output/props/*/blocked_interrogation_60.json
            free-run-output/props/*/prediction.json
            free-run-output/mobile_report.html
          retention-days: 3
          if-no-files-found: warn
      - name: Mark incomplete runs as failed
        if: steps.run.outcome != 'success'
        run: exit 1
