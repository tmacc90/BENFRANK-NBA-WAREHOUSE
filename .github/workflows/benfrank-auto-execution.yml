name: BENFRANK automatic acquisition and forward research
on:
  push:
    branches: [benfrank-60-question-interrogation-20261106]
    paths:
      - 'benfrank_auto_*.py'
      - 'benfrank_v52_early.py'
      - 'benfrank_v52_blind.py'
      - 'run_framework.py'
      - 'configs/auto_*.json'
      - 'tests/test_auto_workflow.py'
      - 'scripts/run_auto_ci.py'
      - 'data/board_captures/**'
      - '.github/workflows/benfrank-auto-execution.yml'
  workflow_dispatch:
    inputs:
      forward_config:
        description: Committed automatic forward config
        default: configs/auto_future_20261107.json
        required: true
        type: string
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: All software unit and integration tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee software-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benfrank-auto-software-tests-${{ github.run_id }}
          path: software-tests.log
  live-forward:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Execute live discovery or explicitly supplied captured-board research
        env:
          FORWARD_CONFIG: ${{ inputs.forward_config || 'configs/auto_future_20261107.json' }}
        run: |
          set -o pipefail
          python -u scripts/run_auto_ci.py --config "$FORWARD_CONFIG" --capture-config configs/auto_captured_forward_20261107.json --state auto_state --output auto_runs/forward-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} 2>&1 | tee forward-execution.log
      - name: Retain raw sources, failures, histories, all trials and frozen ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benfrank-auto-forward-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            auto_runs/
            auto_state/
            forward-execution.log
          retention-days: 90
          if-no-files-found: error
