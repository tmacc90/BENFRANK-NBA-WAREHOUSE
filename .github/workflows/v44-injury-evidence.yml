name: BENFRANK NBA v4.4 injury evidence feed
on:
  schedule:
    - cron: '0 1,17,21 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'benfrank_v44_injuries.py'
      - 'tests/test_v44_injuries.py'
      - '.github/workflows/v44-injury-evidence.yml'
permissions:
  contents: read
jobs:
  source-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline contract tests
        run: python -m unittest discover -s tests -p test_v44_injuries.py -v
      - name: Timestamp ESPN secondary availability, no official clearance claims
        run: python benfrank_v44_injuries.py --strict --out receipts/injury_report.json
      - name: Preserve injury evidence even on provider error
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benfrank-v44-injuries-${{ github.run_id }}
          path: receipts/
          if-no-files-found: warn
          retention-days: 30
