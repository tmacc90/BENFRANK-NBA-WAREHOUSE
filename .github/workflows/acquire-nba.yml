name: BENFRANK historical import and verification
on:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'sources.json'
      - 'tests/**'
      - '.github/workflows/acquire-nba.yml'
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Space-separated seasons in sources.json'
        required: true
        default: '2024-25 2025-26'
permissions:
  contents: read
concurrency:
  group: benfrank-history-${{ github.ref }}
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install acquisition dependencies
        run: python -m pip install -r requirements.txt
      - name: Run software tests
        shell: bash
        run: |
          mkdir -p acquisition
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee acquisition/tests.log
      - name: Import real archives and reconcile every eligible record
        shell: bash
        env:
          SEASONS: ${{ inputs.seasons || '2024-25 2025-26' }}
        run: |
          set -o pipefail
          read -ra season_list <<< "$SEASONS"
          python -u acquire_history.py --seasons "${season_list[@]}" 2>&1 | tee acquisition/runner.log
      - name: Verify saved records against direct official NBA league logs
        if: always()
        env:
          SEASONS: ${{ inputs.seasons || '2024-25 2025-26' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p acquisition
          read -ra season_list <<< "$SEASONS"
          python -u verify_direct_nba.py --seasons "${season_list[@]}" 2>&1 | tee acquisition/direct_verification.log
      - name: Independently inspect saved database
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from acquire_history import inspect_database, write_json
          path=Path('acquisition/nba_warehouse.sqlite')
          if not path.exists():
              raise SystemExit('No database was produced; acquisition not complete')
          report=inspect_database(str(path))
          write_json('acquisition/post_run_database_audit.json',report)
          print(report)
          if report['integrity_status']!='PASS':
              raise SystemExit(2)
          PY
      - name: Preserve source files, SQLite database, failures and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benfrank-nba-history-${{ github.run_id }}
          path: acquisition/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
